    <script>
		if(typeof jeedom.cmd.addUpdateFunction !== 'function') { // before 4.3
			jeedom.cmd.addUpdateFunction = function(id,func) {
				jeedom.cmd.update[id]=func;
			}
		}

		$('#aTVlaunch#id#').on('change', function () {
			var app = $(this).val();
			if (!app) return;
			jeedom.cmd.execute({id: '#cmd_launch_app_id#', value: {select: app}});
			$(this).val(''); // prêt pour lancer une autre app
			panelDownCloseApp#id#();
		});

//Apple clignotante
      	$('.eqLogic[data-eqLogic_id=#id#] .cmd').click(function(){
			$('.eqLogic[data-eqLogic_id=#id#] .image-clignote').fadeOut(200);
			$('.eqLogic[data-eqLogic_id=#id#] .image-clignote').fadeIn(200);
			$('.eqLogic[data-eqLogic_id=#id#] .image-clignote').fadeOut(200);
			$('.eqLogic[data-eqLogic_id=#id#] .image-clignote').fadeIn(200);
			$('.eqLogic[data-eqLogic_id=#id#] .image-clignote').fadeOut(100);
		});

//ATV 4 ou 4K

//Indicateur sous la pochette : égaliseur animé (lecture), image fixe (pause),
//ou chargement (après précédent / suivant jusqu'au nouveau morceau, ou appareil en chargement)
		var eqState#id# = {playing: false, cmdLoading: false, devLoading: false, timer: null, devTimer: null, daemonOff: ('#deamonState#' != 'ok')};
		var prog#id# = {pos: 0, total: 0, at: Date.now(), timer: null}; // position (voir //Position)
		var txt#id# = #txt_js#;
		var loadingLabels#id# = [txt#id#.loading, 'Chargement en cours', 'Loading in progress', 'Ladevorgang läuft', 'Carga en curso', 'Caricamento in corso', 'Carregamento em curso'];
		// Un dernier état « loading » peut rester affiché quand une diffusion AirPlay s'arrête :
		// l'indicateur de chargement venant de l'appareil ne dure que 20 s.
		var devLoadingMax#id# = 20;
		var playHumanAge#id# = parseInt('#play_human_age#', 10) || 0; // âge de la valeur affichée au chargement de la page
		function setDevLoading#id#(isLoading, ageSec) {
			clearTimeout(eqState#id#.devTimer);
			var remain = devLoadingMax#id# - ageSec;
			eqState#id#.devLoading = isLoading && remain > 0;
			if (eqState#id#.devLoading) {
				eqState#id#.devTimer = setTimeout(function() {
					eqState#id#.devLoading = false;
					updateEqualizer#id#();
				}, remain * 1000);
			}
		}
		function updateEqualizer#id#() {
			var img = 'equalizer.png';
			if (eqState#id#.daemonOff) {
				img = 'deamon_off.gif';
			} else if (eqState#id#.cmdLoading || eqState#id#.devLoading) {
				img = 'loading.gif';
			} else if (eqState#id#.playing) {
				img = 'miniEqua.gif';
			}
			var src = 'plugins/aTVremote/core/template/dashboard/images/' + img;
			var el = $('.eqLogic[data-eqLogic_id=#id#] #equa#id#');
			if (el.attr('src') != src) el.attr('src', src);
			if (eqState#id#.daemonOff) el.attr({title: txt#id#.daemonOff, alt: txt#id#.daemonOff});
		}
		function startCmdLoading#id#() {
			eqState#id#.cmdLoading = true;
			clearTimeout(eqState#id#.timer);
			eqState#id#.timer = setTimeout(stopCmdLoading#id#, 10000); // au plus 10 s (dernière piste…)
			updateEqualizer#id#();
		}
		function stopCmdLoading#id#() {
			clearTimeout(eqState#id#.timer);
			eqState#id#.cmdLoading = false;
			updateEqualizer#id#();
		}

//Play_human
		jeedom.cmd.addUpdateFunction('#play_human_id#', function(_options){
			$('.eqLogic[data-eqLogic_id=#id#] #equa#id#').prop({title: _options.display_value, alt: _options.display_value});
			setDevLoading#id#(loadingLabels#id#.indexOf(_options.display_value) != -1, playHumanAge#id#);
			playHumanAge#id# = 0; // les mises à jour suivantes sont des événements reçus à l'instant
			updateEqualizer#id#();
		});
		jeedom.cmd.refreshValue([{cmd_id: '#play_human_id#',display_value:'#play_human#'}]);

//Power_State
		jeedom.cmd.addUpdateFunction('#power_state_id#', function(_options){
			if(_options.display_value == 0){
				$('.eqLogic[data-eqLogic_id=#id#] .cmd.turn_on').show(1);
				$('.eqLogic[data-eqLogic_id=#id#] .cmd.turn_off').hide(1);
			} else {
				$('.eqLogic[data-eqLogic_id=#id#] .cmd.turn_on').hide(1);
				$('.eqLogic[data-eqLogic_id=#id#] .cmd.turn_off').show(1);
			}
		});
		jeedom.cmd.refreshValue([{cmd_id: '#power_state_id#',display_value:'#power_state#'}]);

//App
		jeedom.cmd.addUpdateFunction('#app_id#', function(_options){
			var str_app = String(_options.display_value || '');
			var app_split = str_app.split('.');
			var app_final;
			if (app_split[1] == "apple"){
				app_final = app_split[2];
			} else if(app_split[2] == 'ios') {
				app_final = app_split[3];
			} else {
				app_final = app_split[1];
			}

			if(typeof(app_split[1]) != "undefined" && app_split[1] !== null) {
				$('.eqLogic[data-eqLogic_id=#id#] #sum#id#').text(app_final || '');
				$('.eqLogic[data-eqLogic_id=#id#] .aTVappName').text(app_final || txt#id#.none);
				$('.eqLogic[data-eqLogic_id=#id#] .app_hide').show(1);
			} else {
				$('.eqLogic[data-eqLogic_id=#id#] #sum#id#').text('');
				$('.eqLogic[data-eqLogic_id=#id#] .aTVappName').text(txt#id#.none);
				$('.eqLogic[data-eqLogic_id=#id#] .app_hide').hide(1);
			}
			$('.eqLogic[data-eqLogic_id=#id#] .appsBox').show(1);
		});
		jeedom.cmd.refreshValue([{cmd_id: '#app_id#',display_value:'#app#'}]);

//Play_state
		jeedom.cmd.addUpdateFunction('#play_state_id#', function(_options){
			if(_options.display_value == 0){
				$('.eqLogic[data-eqLogic_id=#id#] .cmd.play_btn').show(1);
				$('.eqLogic[data-eqLogic_id=#id#] .cmd.pause_btn').hide(1);
				progFreeze#id#();
				eqState#id#.playing = false;
				updateEqualizer#id#();
				progRender#id#();
			} else if(_options.display_value == 1){
				$('.eqLogic[data-eqLogic_id=#id#] .cmd.play_btn').hide(1);
				$('.eqLogic[data-eqLogic_id=#id#] .cmd.pause_btn').show(1);
				progFreeze#id#();
				eqState#id#.playing = true;
				updateEqualizer#id#();
				progRender#id#();
			}
		});
		jeedom.cmd.refreshValue([{cmd_id: '#play_state_id#',display_value:'#play_state#'}]);

//Artwork
		jeedom.cmd.addUpdateFunction('#artwork_url_id#', function(_options){
			releasePressed#id#();
			stopCmdLoading#id#();
			setArtwork#id#(_options.display_value);
		});
		// La nouvelle pochette est posée une fois chargée (pas d'image vide entre deux morceaux), puis le
		// flou du fond change très légèrement : sinon Safari peut ne repeindre qu'une partie du fond flouté.
		function setArtwork#id#(url) {
			var apply = function() {
				$('#artworkForeground_#id#').prop('src', url);
				$('.eqLogic[data-eqLogic_id=#id#] .aTVpanelBg').css('background-image', "url("+url+")");
				$('.artworkBackground_#id#').css('background-image', "url("+url+")").toggleClass('artworkBlur-repaint');
			};
			var img = new Image();
			img.onload = apply;
			img.onerror = apply;
			img.src = url;
		}
		jeedom.cmd.refreshValue([{cmd_id: '#artwork_url_id#',display_value:'#artwork_url#'}]);

//Métadonnées : lignes sous la pochette et dans le panneau Info (défilement si trop long)
		function setMeta#id#(cls, value) {
			value = String(value == null ? '' : value);
			$('.eqLogic[data-eqLogic_id=#id#] .' + cls).toggle(value != '-');
			$('.eqLogic[data-eqLogic_id=#id#] .' + cls + ' .aTVtxt').text(value);
			fitMarquee#id#();
		}
		jeedom.cmd.addUpdateFunction('#artist_id#', function(_options){
			setMeta#id#('artist_hide', _options.display_value);
		});
		jeedom.cmd.addUpdateFunction('#album_id#', function(_options){
			setMeta#id#('album_hide', _options.display_value);
		});
		jeedom.cmd.addUpdateFunction('#title_id#', function(_options){
			releasePressed#id#();
			stopCmdLoading#id#();
			setMeta#id#('titre_hide', _options.display_value);
		});
		jeedom.cmd.refreshValue([{cmd_id: '#artist_id#',display_value:'#artist#'}]);
		jeedom.cmd.refreshValue([{cmd_id: '#album_id#',display_value:'#album#'}]);
		jeedom.cmd.refreshValue([{cmd_id: '#title_id#',display_value:'#title#'}]);

//Lien Apple Music (icône Apple en bas à droite de la pochette) : seulement pour un morceau de musique avec un identifiant iTunes Store
//(Apple Music / iTunes) ; rien pour Spotify, une radio, un film ou une série (identifiants d'une autre boutique)
		var itunesId#id# = '', mediaType#id# = '';
		function updateAppleMusic#id#() {
			var link = $('#appleMusic#id#');
			if (/^[1-9][0-9]*$/.test(itunesId#id#) && mediaType#id#.toLowerCase() == 'music') {
				link.attr('href', 'https://music.apple.com/song/' + itunesId#id#).show();
			} else {
				link.hide().attr('href', '#');
			}
		}
		jeedom.cmd.addUpdateFunction('#itunes_id_id#', function(_options){
			itunesId#id# = String(_options.display_value || '').trim();
			updateAppleMusic#id#();
		});

//Genre / type de média : dans la ligne d'infos défilante
		function setMediaInfo#id#(cls, value) {
			value = String(value == null ? '' : value);
			var empty = (value == '-' || value == 'Unknown' || value == '');
			$('.eqLogic[data-eqLogic_id=#id#] .info_hide .' + cls).text(empty ? '' : value).toggle(!empty);
			fitMarquee#id#();
		}
		jeedom.cmd.addUpdateFunction('#genre_id#', function(_options){
			setMediaInfo#id#('genre', _options.display_value);
		});
		jeedom.cmd.addUpdateFunction('#media_type_id#', function(_options){
			setMediaInfo#id#('media', _options.display_value);
			mediaType#id# = String(_options.display_value || '');
			updateAppleMusic#id#();
		});
		jeedom.cmd.refreshValue([{cmd_id: '#genre_id#',display_value:'#genre#'}]);
		jeedom.cmd.refreshValue([{cmd_id: '#media_type_id#',display_value:'#media_type#'}]);
		jeedom.cmd.refreshValue([{cmd_id: '#itunes_id_id#',display_value:'#itunes_id#'}]);

//Position : dans la ligne d'infos défilante.
//Le démon n'envoie la position qu'aux changements d'état (début de piste, pause, reprise…) :
//entre deux messages, elle avance localement à partir de la dernière position reçue.
		function progParseTime#id#(t) { // "5s", "03:50", "1:02:03"
			t = String(t || '').trim();
			if (/^\d+s$/.test(t)) return parseInt(t, 10);
			if (!/^\d+(:\d+){1,2}$/.test(t)) return NaN;
			return t.split(':').reduce(function(acc, v) { return acc * 60 + parseInt(v, 10); }, 0);
		}
		function progFormat#id#(sec) {
			sec = Math.max(0, Math.round(sec));
			var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
			return (h ? h + ':' + (m < 10 ? '0' : '') : '') + m + ':' + (s < 10 ? '0' : '') + s;
		}
		function progCurrent#id#() {
			var pos = prog#id#.pos + (eqState#id#.playing ? (Date.now() - prog#id#.at) / 1000 : 0);
			return Math.min(Math.max(pos, 0), prog#id#.total);
		}
		function progFreeze#id#() { // avant un changement lecture / pause : on fixe la position atteinte
			prog#id#.pos = progCurrent#id#();
			prog#id#.at = Date.now();
		}
		function progRender#id#() {
			var el = $('.eqLogic[data-eqLogic_id=#id#] .info_hide .position');
			if (!el.length || !document.body.contains(el[0])) { clearInterval(prog#id#.timer); return; } // widget redessiné
			if (prog#id#.total <= 0) {
				clearInterval(prog#id#.timer);
				prog#id#.timer = null;
				return;
			}
			var pos = progCurrent#id#(), pct = Math.round(pos * 100 / prog#id#.total);
			el.text(progFormat#id#(pos) + ' / ' + progFormat#id#(prog#id#.total) + ' (' + pct + '%)')
				.attr('title', pct + ' % · ' + txt#id#.remain + ' ' + progFormat#id#(prog#id#.total - pos));
			// le texte s'allonge (ex. 9:59 → 10:00) : ne relancer le défilement que s'il ne tient plus
			var line = el.closest('.aTVline');
			if (!line.hasClass('scrolling') && line.children('.aTVscroll')[0].scrollWidth > line.innerWidth() + 1) fitMarquee#id#();
			if (eqState#id#.playing && !prog#id#.timer) {
				prog#id#.timer = setInterval(progRender#id#, 1000);
			} else if (!eqState#id#.playing && prog#id#.timer) {
				clearInterval(prog#id#.timer);
				prog#id#.timer = null;
			}
		}
		var positionAge#id# = parseInt('#position_age#', 10) || 0; // âge de la position affichée au chargement de la page
		jeedom.cmd.addUpdateFunction('#position_id#', function(_options){
			// ex. "5s/03:50 (2%)"
			var value = String(_options.display_value || '');
			var m = value.match(/^\s*([^\/\s]+)\s*\/\s*([^\s(]+)/);
			var pos = m ? progParseTime#id#(m[1]) : NaN, total = m ? progParseTime#id#(m[2]) : NaN;
			var el = $('.eqLogic[data-eqLogic_id=#id#] .info_hide .position');
			if (isNaN(pos) || isNaN(total) || total <= 0) {
				prog#id#.total = 0;
				// format inconnu : affiché tel quel
				el.text((value == '-') ? '' : value).removeAttr('title').toggle(value != '-' && value != '');
			} else {
				prog#id#.total = total;
				prog#id#.pos = pos;
				prog#id#.at = Date.now() - (positionAge#id# * 1000); // au chargement : la position date de positionAge s
				el.show();
			}
			positionAge#id# = 0; // les mises à jour suivantes sont des événements reçus à l'instant
			progRender#id#();
			fitMarquee#id#();
		});
		jeedom.cmd.refreshValue([{cmd_id: '#position_id#',display_value:'#position#'}]);

//volume
		jeedom.cmd.addUpdateFunction('#volume_id#', function(_options){
			$('.eqLogic[data-eqLogic_id=#id#] .volume_aTVremote').text(_options.display_value);
			if(_options.display_value == 0) {
				$('.eqLogic[data-eqLogic_id=#id#] .volumeContainer_aTVremote').css('left','94px');
			} else if(_options.display_value == 100) {
				$('.eqLogic[data-eqLogic_id=#id#] .volumeContainer_aTVremote').css('left','86px');
			} else {
				$('.eqLogic[data-eqLogic_id=#id#] .volumeContainer_aTVremote').css('left','90px');
			}
		});
		jeedom.cmd.refreshValue([{cmd_id: '#volume_id#',display_value:'#volume#'}]);

//Repeat
		jeedom.cmd.addUpdateFunction('#repeat_state_id#', function(_options){
			if(_options.display_value == '1'){
				$('.eqLogic[data-eqLogic_id=#id#] .cmd.set_repeat_all').hide(1);
				$('.eqLogic[data-eqLogic_id=#id#] .cmd.set_repeat_track').hide(1);
				$('.eqLogic[data-eqLogic_id=#id#] .cmd.set_repeat_off').show(1);
			} else if(_options.display_value == '2'){
				$('.eqLogic[data-eqLogic_id=#id#] .cmd.set_repeat_all').hide(1);
				$('.eqLogic[data-eqLogic_id=#id#] .cmd.set_repeat_track').show(1);
				$('.eqLogic[data-eqLogic_id=#id#] .cmd.set_repeat_off').hide(1);
			} else if(_options.display_value == '0'){
				$('.eqLogic[data-eqLogic_id=#id#] .cmd.set_repeat_all').show(1);
				$('.eqLogic[data-eqLogic_id=#id#] .cmd.set_repeat_off').hide(1);
				$('.eqLogic[data-eqLogic_id=#id#] .cmd.set_repeat_track').hide(1);
			}
		});
		jeedom.cmd.refreshValue([{cmd_id: '#repeat_state_id#',display_value:'#repeat_state#'}]);

//Shuffle
		jeedom.cmd.addUpdateFunction('#shuffle_state_id#', function(_options){
			if(_options.display_value == '0'){
				$('.eqLogic[data-eqLogic_id=#id#] .cmd.set_shuffle_on').show(1);
				$('.eqLogic[data-eqLogic_id=#id#] .cmd.set_shuffle_off').hide(1);
			} else if(_options.display_value == '1'){
				$('.eqLogic[data-eqLogic_id=#id#] .cmd.set_shuffle_on').hide(1);
				$('.eqLogic[data-eqLogic_id=#id#] .cmd.set_shuffle_off').show(1);
			}
		});
		jeedom.cmd.refreshValue([{cmd_id: '#shuffle_state_id#',display_value:'#shuffle_state#'}]);

//Aléatoire / répétition utilisables avec la source en cours (liste « features » demandée par le démon
//à chaque changement de morceau) : sinon boutons grisés, mais toujours cliquables (un clic revérifie).
		function setAvailable#id#(cls, value) {
			var off = (String(value) === '0'); // valeur inconnue (commande pas encore créée…) : disponible
			$('.eqLogic[data-eqLogic_id=#id#] .cmd.' + cls).each(function() {
				var btn = $(this);
				if (btn.data('baseTitle') === undefined) btn.data('baseTitle', btn.attr('title'));
				var label = btn.data('baseTitle') + (off ? ' (' + txt#id#.unavailable + ')' : '');
				btn.toggleClass('aTVunavailable', off).attr({title: label, 'aria-label': label}); // pas aria-disabled : le clic reste utile
			});
		}
		jeedom.cmd.addUpdateFunction('#shuffle_available_id#', function(_options){
			setAvailable#id#('btn_aTVremote_shuffle', _options.display_value);
		});
		jeedom.cmd.addUpdateFunction('#repeat_available_id#', function(_options){
			setAvailable#id#('btn_aTVremote_repeat', _options.display_value);
		});
		setAvailable#id#('btn_aTVremote_shuffle', '#shuffle_available#');
		setAvailable#id#('btn_aTVremote_repeat', '#repeat_available#');

//Texte défilant (remplace <marquee>, qui ne fonctionne pas partout) : une seule ligne, défilement
//seulement si le texte dépasse, selon l'option « marquee » du plugin (alternate = aller-retour,
//scroll = boucle continue). La ligne d'infos (genre, type, position) défile toujours en boucle.
		function fitMarquee#id#() {
			var loopOption = ('#marquee#' == 'scroll');
			$('.eqLogic[data-eqLogic_id=#id#] .aTVline').each(function() {
				var line = $(this), inner = line.children('.aTVscroll');
				var loop = loopOption || line.hasClass('aTVloop');
				line.removeClass('scrolling alt loop');
				inner.children('.aTVtxt').slice(1).remove();
				var txt = inner.children('.aTVtxt');
				var boxW = line.innerWidth(), txtW = inner[0].scrollWidth;
				if (!line.is(':visible') || boxW === 0 || txtW <= boxW + 1) return;
				if (loop) {
					txt.clone().attr('aria-hidden', 'true').appendTo(inner); // 2 copies : translateX(-50%) boucle sans à-coup
					line[0].style.setProperty('--aTVdur', Math.max(6, (txtW + 40) / 30) + 's');
					line.addClass('scrolling loop');
				} else {
					line.addClass('scrolling alt'); // mesure APRÈS la classe : marges et police de 12px
					var over = inner[0].scrollWidth - boxW;
					if (over <= 1) { line.removeClass('alt'); return; } // tient en 12px : immobile
					line[0].style.setProperty('--aTVshift', (-over) + 'px');
					line[0].style.setProperty('--aTVdur', Math.max(4, over / 30 / 0.7) + 's');
				}
			});
		}
		$(window).on('resize', fitMarquee#id#);
		// les largeurs ne sont justes qu'une fois style.css chargé (pas encore le cas à l'exécution du script)
		$('.eqLogic[data-eqLogic_id=#id#] link[rel=stylesheet]').on('load', fitMarquee#id#);
		setTimeout(fitMarquee#id#, 1000);
		fitMarquee#id#();

//Panneau Apps : sur la partie haute du widget
		function aTVpanelOpen#id#(cls) {
			var panel = $(".eqLogic[data-eqLogic_id=#id#] ." + cls);
			panel.addClass('open').attr('aria-hidden', 'false');
			fitMarquee#id#(); // largeurs connues seulement une fois le panneau affiché
			setTimeout(function() { panel.find('.aTVpanelClose').focus(); }, 50); // clavier : focus dans le panneau
		}
		function aTVpanelClose#id#(cls, opener) {
			var panel = $(".eqLogic[data-eqLogic_id=#id#] ." + cls);
			if (!panel.hasClass('open')) return;
			var hadFocus = $.contains(panel[0], document.activeElement);
			panel.removeClass('open').attr('aria-hidden', 'true');
			if (hadFocus) $(".eqLogic[data-eqLogic_id=#id#] ." + opener).focus(); // le focus revient sur le bouton d'ouverture
		}
      	function panelDownApp#id#() { aTVpanelOpen#id#('aTVappsPanel'); }
		function panelDownCloseApp#id#() { aTVpanelClose#id#('aTVappsPanel', 'appsBox'); }

		$('.eqLogic[data-eqLogic_id=#id#] .cmd').on('click', function() {
			jeedom.cmd.execute({id: $(this).data('cmd_id')});
		});

		// Clavier : Entrée / Espace activent les boutons, Échap ferme le panneau Apps
		$('.eqLogic[data-eqLogic_id=#id#] [role=button]').on('keydown', function(e) {
			if (e.key != 'Enter' && e.key != ' ' && e.key != 'Spacebar') return;
			e.preventDefault();
			$(this).trigger('click');
		});
		$('.eqLogic[data-eqLogic_id=#id#] .aTVappsPanel').on('keydown', function(e) {
			if (e.key == 'Escape' || e.key == 'Esc') panelDownCloseApp#id#();
		});

		// Écran tactile : précédent / suivant restent grisés après un toucher jusqu'au changement de
		// morceau (pochette ou titre), 8 s au plus. Les autres boutons ne restent pas grisés. À la souris : :hover.
		var pressedTimer#id#;
		$('.eqLogic[data-eqLogic_id=#id#] .cmd').on('click', function() {
			if (!$(this).is('.previous, .next')) return;
			if (!window.matchMedia || !window.matchMedia('(hover: none)').matches) return;
			$(this).addClass('aTVpressed');
			clearTimeout(pressedTimer#id#);
			pressedTimer#id# = setTimeout(releasePressed#id#, 8000);
		});
		$('.eqLogic[data-eqLogic_id=#id#] .cmd.previous, .eqLogic[data-eqLogic_id=#id#] .cmd.next').on('click', startCmdLoading#id#);
		function releasePressed#id#() {
			clearTimeout(pressedTimer#id#);
			$('.eqLogic[data-eqLogic_id=#id#] .aTVpressed').removeClass('aTVpressed');
		}
    </script>
</div>
