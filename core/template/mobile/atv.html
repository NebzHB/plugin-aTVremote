<div class="eqLogic-widget eqLogic aTVremote am am-atv" data-eqType="#eqType#" data-translate-category="#translate_category#" style="border:#border#;#style#;" data-eqLogic_id="#id#" data-eqLogic_uid="#uid#" data-version="#version#" data-marquee="#marquee#"
	data-id-artwork_url="#artwork_url_id#" data-val-artwork_url="#artwork_url#"
	data-id-title="#title_id#" data-val-title="#title#"
	data-id-artist="#artist_id#" data-val-artist="#artist#"
	data-id-album="#album_id#" data-val-album="#album#"
	data-id-genre="#genre_id#" data-val-genre="#genre#"
	data-id-media_type="#media_type_id#" data-val-media_type="#media_type#"
	data-id-position="#position_id#" data-val-position="#position#"
	data-id-app="#app_id#" data-val-app="#app#"
	data-id-play_human="#play_human_id#" data-val-play_human="#play_human#"
	data-id-play_state="#play_state_id#" data-val-play_state="#play_state#"
	data-id-power_state="#power_state_id#" data-val-power_state="#power_state#"
	data-id-volume="#volume_id#" data-val-volume="#volume#"
	data-id-repeat_state="#repeat_state_id#" data-val-repeat_state="#repeat_state#"
	data-id-shuffle_state="#shuffle_state_id#" data-val-shuffle_state="#shuffle_state#">
<!--  Apple TV (mobile) : Apple TV 4/4K et Apple TV 3, les commandes absentes sont masquées -->
	<link rel="stylesheet" href="plugins/aTVremote/core/template/mobile/css/style.css" />
	<script src="plugins/aTVremote/core/template/mobile/js/aTVmobile.js"></script>

	<div class="am-bg"></div>
	<div class="am-inner">

		<div class="am-head">
			<div class="am-title-box">
				<span class="am-name" style="#hideEqLogicName#;" title="#device# #ATV# #os# #osVersion#">#name_display#</span>
				<span class="am-status"><span class="am-eq"><i></i><i></i><i></i></span><span class="am-status-text"></span></span>
			</div>
			<button type="button" class="am-btn am-refresh" data-cmd="#cmd_refresh_id#" aria-label="Rafraîchir" hidden><i data-ic="refresh"></i></button>
			<button type="button" class="am-btn am-power-on" data-cmd="#cmd_turn_on_id#" aria-label="Allumer" hidden><i data-ic="power"></i></button>
			<button type="button" class="am-btn am-power-off" data-cmd="#cmd_turn_off_id#" aria-label="Éteindre" hidden><i data-ic="power"></i></button>
		</div>

		<div class="am-body">
			<div class="am-now">
				<div class="am-art"><i data-ic="note"></i><img alt="" /></div>
				<div class="am-meta">
					<div class="am-line am-title" hidden><span></span></div>
					<div class="am-line am-artist" hidden><span></span></div>
					<div class="am-line am-album" hidden><span></span></div>
					<div class="am-sub" hidden></div>
					<span class="am-app" hidden></span>
				</div>
			</div>

			<div class="am-group am-transport">
				<button type="button" class="am-btn" data-cmd="#cmd_previous_id#" aria-label="Précédent"><i data-ic="prev"></i></button>
				<button type="button" class="am-btn am-main am-play" data-cmd="#cmd_play_id#" aria-label="Lecture"><i data-ic="play"></i></button>
				<button type="button" class="am-btn am-main am-pause" data-cmd="#cmd_pause_id#" aria-label="Pause" hidden><i data-ic="pause"></i></button>
				<button type="button" class="am-btn" data-cmd="#cmd_stop_id#" aria-label="Stop"><i data-ic="stop"></i></button>
				<button type="button" class="am-btn" data-cmd="#cmd_next_id#" aria-label="Suivant"><i data-ic="next"></i></button>
			</div>

			<div class="am-group am-pad">
				<button type="button" class="am-btn am-up" data-cmd="#cmd_up_id#" aria-label="Haut"><i data-ic="chevron"></i></button>
				<button type="button" class="am-btn am-left" data-cmd="#cmd_left_id#" aria-label="Gauche"><i data-ic="chevron"></i></button>
				<button type="button" class="am-btn am-ok" data-cmd="#cmd_select_id#" aria-label="OK"></button>
				<button type="button" class="am-btn am-right" data-cmd="#cmd_right_id#" aria-label="Droite"><i data-ic="chevron"></i></button>
				<button type="button" class="am-btn am-down" data-cmd="#cmd_down_id#" aria-label="Bas"><i data-ic="chevron"></i></button>
			</div>

			<div class="am-group am-nav">
				<button type="button" class="am-btn" data-cmd="#cmd_menu_id#" aria-label="Retour"><i data-ic="back"></i></button>
				<button type="button" class="am-btn" data-cmd="#cmd_top_menu_id#" aria-label="Accueil"><i data-ic="home"></i></button>
				<button type="button" class="am-btn" data-cmd="#cmd_volume_down_id#" aria-label="Volume -"><i data-ic="minus"></i></button>
				<span class="am-vol-value" title="Volume">–</span>
				<button type="button" class="am-btn" data-cmd="#cmd_volume_up_id#" aria-label="Volume +"><i data-ic="plus"></i></button>
			</div>

			<div class="am-group am-modes">
				<button type="button" class="am-btn am-shuffle" data-c-on="#cmd_set_shuffle_on_id#" data-c-off="#cmd_set_shuffle_off_id#" aria-label="Aléatoire"><i data-ic="shuffle"></i></button>
				<button type="button" class="am-btn am-repeat" data-c-all="#cmd_set_repeat_all_id#" data-c-track="#cmd_set_repeat_track_id#" data-c-off="#cmd_set_repeat_off_id#" aria-label="Répétition"><i data-ic="repeat"></i></button>
				<select class="am-launch" data-cmd-set="#cmd_launch_app_id#" aria-label="Lancer une app"><option value="">Lancer une app…</option>#cmd_launch_app_opt#</select>
			</div>
		</div>
	</div>
	<script>aTVremoteMobile.init($('.eqLogic[data-eqLogic_uid="#uid#"]'));</script>
</div>
